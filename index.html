    <script>
        (function() {
            // Dil ve RTL Kontrolü
            const savedLang = localStorage.getItem('user_lang') || 'tr';
            document.documentElement.lang = savedLang;
            if (savedLang === 'ar') document.documentElement.dir = 'rtl';

            // Tema Yükleme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            }

            // Özel Renk Paleti Yükleme
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta property="og:title" content="Günün Ayeti & Duası | Ayetin Vakti">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Arapça Font Uyumluluğu */
        html[lang="ar"] {
            --font-family: 'Amiri', 'Traditional Arabic', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            padding-top: 5px;
        }

        .top-nav {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        [dir="rtl"] .top-nav {
            right: auto;
            left: 0;
        }

        .home-btn {
            position: absolute;
            left: 0;
            top: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        [dir="rtl"] .home-btn {
            left: auto;
            right: 0;
            transform: scaleX(-1);
        }

        .home-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .top-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            height: 42px;
            padding: 0 14px;
            border-radius: 21px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .top-btn:hover {
            border-color: var(--accent-color);
        }

        .theme-icon-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .theme-icon-btn:hover {
            border-color: var(--accent-color);
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-top: 50px;
            margin-bottom: 4px;
            text-align: center;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 22px 18px;
            width: 100%;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .badge {
            background-color: rgba(16, 185, 129, 0.12);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .fav-icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .fav-icon-btn.active {
            color: #f59e0b;
        }

        .arabic-text {
            font-size: 1.45rem;
            text-align: right;
            line-height: 2.2;
            color: var(--text-color);
            font-family: 'Amiri', 'Traditional Arabic', serif;
            direction: rtl;
        }

        [dir="rtl"] .arabic-text {
            text-align: right;
        }

        .meaning-text {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--text-color);
            font-style: italic;
        }

        [dir="rtl"] .meaning-text,
        [dir="rtl"] .source-text {
            text-align: right;
        }

        .source-text {
            font-size: 0.85rem;
            color: var(--accent-color);
            text-align: right;
            font-weight: 600;
            opacity: 0.9;
        }

        .audio-actions {
            display: flex;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }

        .audio-btn {
            width: 100%;
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 11px 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fav-item {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .fav-item:hover {
            border-color: var(--accent-color);
        }

        .fav-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            flex: 1;
        }

        .fav-info strong {
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .fav-info span {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
        }

        .delete-fav-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.9rem;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            display: none;
            z-index: 3000;
            box-shadow: var(--shadow);
        }

        .toast.show {
            display: block;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Light Mode Destekleri (Ayarlar Reposu ile Birebir Uyumlu) */
        body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
    </style>
</head>

            sura: null, ayah: null,
            arabic: "إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ",
            meaning: "Ameller ancak niyetlere göredir.",
            source: "Buhârî, Bed'ü'l-vahy, 1"
        },
        {
            type: "Hadis-i Şerif",
            sura: null, ayah: null,
            arabic: "تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ",
            meaning: "Din kardeşine tebessüm etmen senin için bir sadakadır.",
            source: "Tirmizî, Birr, 36"
        }
    ];

    let currentIndex = -1;
    let toastTimeout = null;
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    let currentAudio = null;
    let isPlaying = false;

    function applyTranslations(lang) {
        const t = translations[lang] || translations.tr;
        
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });

        const themeBtn = document.getElementById('theme-btn');
        const isLight = document.documentElement.classList.contains('light-mode');
        if (themeBtn) themeBtn.innerHTML = isLight ? '☀️' : '🌙';
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        const themeBtn = document.getElementById('theme-btn');
        if (themeBtn) themeBtn.innerHTML = isLight ? '☀️' : '🌙';
    }

    function getDailyIndex() {
        const today = new Date();
        const dateString = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        let hash = 0;
        for (let i = 0; i < dateString.length; i++) {
            hash = dateString.charCodeAt(i) + ((hash << 5) - hash);
        }
        return Math.abs(hash) % database.length;
    }

    function renderContent(index) {
        stopAudio();
        currentIndex = index;
        const item = database[currentIndex];

        document.getElementById('type-badge').innerText = item.type;
        document.getElementById('arabic-content').innerText = item.arabic;
        document.getElementById('meaning-content').innerText = `"${item.meaning}"`;
        document.getElementById('source-content').innerText = `— ${item.source}`;

        updateFavIcon();
    }

    function getRandomContent() {
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * database.length);
        } while (newIndex === currentIndex && database.length > 1);
        
        renderContent(newIndex);
    }

    function updateFavIcon() {
        const favBtn = document.getElementById('fav-btn');
        const isFav = favorites.includes(currentIndex);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerText = isFav ? '★' : '☆';
    }

    function toggleFavorite() {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const favIndex = favorites.indexOf(currentIndex);
        
        if (favIndex > -1) {
            favorites.splice(favIndex, 1);
            showToast(t.toast_removed);
        } else {
            favorites.push(currentIndex);
            showToast(t.toast_added);
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
    }

    function openFavoritesModal() {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const favList = document.getElementById('fav-list');
        favList.innerHTML = '';

        if (favorites.length === 0) {
            favList.innerHTML = `<div class="empty-msg">${t.empty_fav}</div>`;
        } else {
            favorites.forEach(idx => {
                const item = database[idx];
                const div = document.createElement('div');
                div.className = 'fav-item';
                div.innerHTML = `
                    <div class="fav-info" onclick="selectFromFav(${idx})">
                        <strong>${item.type}</strong>
                        <span>${item.meaning}</span>
                    </div>
                    <button class="delete-fav-btn" onclick="removeFavorite(event, ${idx})">🗑️</button>
                `;
                favList.appendChild(div);
            });
        }
        document.getElementById('fav-modal').classList.add('active');
    }

    function closeFavoritesModal(e) {
        if (!e || e.target.id === 'fav-modal' || e.target.classList.contains('modal-close')) {
            document.getElementById('fav-modal').classList.remove('active');
        }
    }

    function selectFromFav(index) {
        renderContent(index);
        closeFavoritesModal();
    }

    function removeFavorite(e, index) {
        e.stopPropagation();
        favorites = favorites.filter(id => id !== index);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
        openFavoritesModal();
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.src = "";
            currentAudio = null;
        }
        isPlaying = false;
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const btn = document.getElementById('btn-audio-ar');
        if(btn) btn.innerText = t.audio_btn;
    }

    function playArabic() {
        const item = database[currentIndex];
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const btn = document.getElementById('btn-audio-ar');

        if (isPlaying) {
            stopAudio();
            return;
        }

        if (!item.sura || !item.ayah) {
            showToast(t.toast_no_audio);
            return;
        }

        btn.innerText = t.audio_loading;

        const suraStr = String(item.sura).padStart(3, '0');
        const ayahStr = String(item.ayah).padStart(3, '0');
        const audioUrl = `https://everyayah.com/data/Alafasy_128kbps/${suraStr}${ayahStr}.mp3`;

        currentAudio = new Audio(audioUrl);

        currentAudio.play().then(() => {
            isPlaying = true;
            btn.innerText = t.audio_stop;
        }).catch(() => {
            stopAudio();
            showToast(t.toast_audio_fail);
        });

        currentAudio.onended = () => {
            stopAudio();
        };
    }

    function copyContent() {
        const item = database[currentIndex];
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const textToCopy = `${item.type}\n\n${item.arabic}\n\n"${item.meaning}"\n\n— ${item.source}\n\n${t.share_suffix}`;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(t.toast_copied);
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast(t.toast_copied);
        } catch (err) {
            showToast(t.toast_copy_fail);
        }
        document.body.removeChild(textArea);
    }

    function shareContent() {
        const item = database[currentIndex];
        const shareData = {
            title: 'Ayetin Vakti',
            text: `${item.type}: "${item.meaning}" (${item.source})`,
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            copyContent();
        }
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.classList.add('light-mode');
        }

        const savedLang = localStorage.getItem('user_lang') || 'tr';
        applyTranslations(savedLang);

        renderContent(getDailyIndex());
    });
</script>

</body>
</html>
