<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günün Ayeti ve Duası | Ayetin Vakti</title>

    <meta property="og:title" content="Günün Ayeti & Duası | Ayetin Vakti">
    <meta property="og:description" content="Her gün yeni bir feyz ve ilham. Ayet, hadis ve duaları keşfedin ve paylaşın.">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --arabic-color: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            --modal-bg: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --arabic-color: #1e293b;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --modal-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .top-nav {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            gap: 8px;
        }

        /* Zikirmatikteki gibi sadece ok simgeli buton */
        .home-btn {
            position: absolute;
            left: 0;
            top: 0;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover {
            background-color: var(--btn-hover);
        }

        .top-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            height: 38px;
            padding: 0 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-btn:hover {
            background-color: var(--btn-hover);
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-top: 35px;
            margin-bottom: 6px;
            text-align: center;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .badge {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fav-icon-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .fav-icon-btn.active {
            color: #f59e0b;
        }

        .fav-icon-btn:hover {
            transform: scale(1.15);
        }

        .arabic-text {
            font-size: 1.6rem;
            text-align: right;
            line-height: 2.2;
            color: var(--arabic-color);
            font-family: 'Amiri', 'Traditional Arabic', serif;
            margin-top: 5px;
            direction: rtl;
        }

        .meaning-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
            font-style: italic;
        }

        .source-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: right;
            font-weight: 600;
        }

        .audio-actions {
            display: flex;
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
            margin-top: 4px;
        }

        .audio-btn {
            width: 100%;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--btn-bg);
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .audio-btn:hover {
            background-color: var(--btn-hover);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--btn-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            touch-action: manipulation;
        }

        .btn:hover {
            background-color: var(--btn-hover);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .fav-item {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .fav-item:hover {
            background-color: var(--btn-hover);
        }

        .fav-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .fav-info strong {
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .fav-info span {
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-fav-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.95rem;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 3000;
        }

        .toast.show {
            opacity: 1;
        }

        .footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Zikirmatikteki gibi sadece ok tuşu -->
        <button class="home-btn" onclick="goHome()" title="Ana Sayfa">←</button>

        <div class="top-nav">
            <button class="top-btn" onclick="openFavoritesModal()">⭐ Favorilerim</button>
            <button class="top-btn" onclick="toggleTheme()" id="theme-btn" aria-label="Tema değiştir">☀️ Gündüz</button>
        </div>
        <h1>Günün Ayeti & Duası</h1>
        <p>Her gün yeni bir feyz ve ilham</p>
    </div>

    <div class="card">
        <div class="card-top">
            <span class="badge" id="type-badge">Yükleniyor...</span>
            <button class="fav-icon-btn" id="fav-btn" onclick="toggleFavorite()" title="Favorilere Ekle">★</button>
        </div>
        
        <div class="arabic-text" id="arabic-content" lang="ar">
            ...
        </div>

        <div class="meaning-text" id="meaning-content">
            Yükleniyor...
        </div>

        <div class="source-text" id="source-content">
            —
        </div>

        <div class="audio-actions">
            <button class="audio-btn" id="btn-audio-ar" onclick="playArabic()">🎙️ Hafız Tilaveti (Arapça Dinle)</button>
        </div>

        <div class="actions">
            <button class="btn" onclick="copyContent()">📋 Kopyala</button>
            <button class="btn" onclick="shareContent()">🔗 Paylaş</button>
            <button class="btn btn-primary" onclick="getRandomContent()">Yeni 🌟(Ayet, Dua Hadis)</button>
        </div>
    </div>

    <div class="footer">
        Ayetin Vakti • Günlük Huzur
    </div>
</div>

<div class="modal-overlay" id="fav-modal" onclick="closeFavoritesModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2>⭐ Favori İçeriklerim</h2>
            <button class="close-btn" onclick="closeFavoritesModal()">&times;</button>
        </div>
        <div class="modal-body" id="fav-list"></div>
    </div>
</div>

<div class="toast" id="toast" role="alert" aria-live="polite">İşlem tamamlandı!</div>

<script>
    const database = [
        {
            type: "Ayet-i Kerime",
            sura: 2, ayah: 152,
            arabic: "فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ",
            meaning: "Öyleyse beni anın ki ben de sizi anayım. Bana şükredin, nankörlük etmeyin.",
            source: "Bakara Suresi, 152. Ayet"
        },
        {
            type: "Ayet-i Kerime",
            sura: 13, ayah: 28,
            arabic: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",
            meaning: "Bilesiniz ki, kalpler ancak Allah'ı anmakla huzur bulur.",
            source: "Ra'd Suresi, 28. Ayet"
        },
        {
            type: "Ayet-i Kerime",
            sura: 94, ayah: 6,
            arabic: "إِنَّ مَعَ الْعُسْرِ يُسْرًا",
            meaning: "Şüphesiz her güçlükle beraber bir kolaylık vardır.",
            source: "İnşirah Suresi, 6. Ayet"
        },
        {
            type: "Ayet-i Kerime",
            sura: 52, ayah: 48,
            arabic: "وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا",
            meaning: "Rabbinin hükmüne sabret. Çünkü sen gözümüzün önündesin.",
            source: "Tûr Suresi, 48. Ayet"
        },
        {
            type: "Ayet-i Kerime",
            sura: 3, ayah: 173,
            arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
            meaning: "Allah bize yeter, O ne güzel vekildir.",
            source: "Âl-i İmrân Suresi, 173. Ayet"
        },
        {
            type: "Ayet-i Kerime",
            sura: 2, ayah: 186,
            arabic: "وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دعانِ",
            meaning: "Kullarım sana beni sorarlarsa şüphesiz ben yakınım. Dua edenin duasına icabet ederim.",
            source: "Bakara Suresi, 186. Ayet"
        },
        {
            type: "Ayet-i Kerime",
            sura: 2, ayah: 153,
            arabic: "إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",
            meaning: "Şüphesiz Allah sabredenlerle beraberdir.",
            source: "Bakara Suresi, 153. Ayet"
        },
        {
            type: "Günün Duası",
            sura: 2, ayah: 201,
            arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
            meaning: "Rabbimiz! Bize dünyada da iyilik ver, ahirette de iyilik ver ve bizi ateş azabından koru.",
            source: "Bakara Suresi, 201. Ayet"
        },
        {
            type: "Günün Duası",
            sura: 20, ayah: 25,
            arabic: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي",
            meaning: "Rabbim! Göğsümü genişlet, işimi kolaylaştır.",
            source: "Tâhâ Suresi, 25-26. Ayetler"
        },
        {
            type: "Günün Duası",
            sura: 21, ayah: 87,
            arabic: "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ",
            meaning: "Senden başka hiçbir ilah yoktur. Seni tenzih ederim. Şüphesiz ben zalimlerden oldum.",
            source: "Enbiyâ Suresi, 87. Ayet (Hz. Yunus'un Duası)"
        },
        {
            type: "Hadis-i Şerif",
            sura: null, ayah: null,
            arabic: "إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ",
            meaning: "Ameller ancak niyetlere göredir.",
            source: "Buhârî, Bed'ü'l-vahy, 1"
        },
        {
            type: "Hadis-i Şerif",
            sura: null, ayah: null,
            arabic: "تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ",
            meaning: "Din kardeşine tebessüm etmen senin için bir sadakadır.",
            source: "Tirmizî, Birr, 36"
        }
    ];

    let currentIndex = -1;
    let toastTimeout = null;
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    let currentAudio = null;
    let isPlaying = false;

    // --- ANA SAYFAYA DÖNÜŞ FONKSİYONU ---
    function goHome() {
        window.location.href = '/'; 
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        applyTheme(isLight ? 'dark' : 'light');
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-btn');
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            btn.innerHTML = '🌙 Gece';
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            btn.innerHTML = '☀️ Gündüz';
            localStorage.setItem('theme', 'dark');
        }
    }

    function getDailyIndex() {
        const today = new Date();
        const dateString = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        let hash = 0;
        for (let i = 0; i < dateString.length; i++) {
            hash = dateString.charCodeAt(i) + ((hash << 5) - hash);
        }
        return Math.abs(hash) % database.length;
    }

    function renderContent(index) {
        stopAudio();
        currentIndex = index;
        const item = database[currentIndex];

        document.getElementById('type-badge').innerText = item.type;
        document.getElementById('arabic-content').innerText = item.arabic;
        document.getElementById('meaning-content').innerText = `"${item.meaning}"`;
        document.getElementById('source-content').innerText = `— ${item.source}`;

        updateFavIcon();
    }

    function getRandomContent() {
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * database.length);
        } while (newIndex === currentIndex && database.length > 1);
        
        renderContent(newIndex);
    }

    function updateFavIcon() {
        const favBtn = document.getElementById('fav-btn');
        const isFav = favorites.includes(currentIndex);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerText = isFav ? '★' : '☆';
    }

    function toggleFavorite() {
        const favIndex = favorites.indexOf(currentIndex);
        if (favIndex > -1) {
            favorites.splice(favIndex, 1);
            showToast("Favorilerden çıkarıldı.");
        } else {
            favorites.push(currentIndex);
            showToast("Favorilere eklendi!");
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
    }

    function openFavoritesModal() {
        const favList = document.getElementById('fav-list');
        favList.innerHTML = '';

        if (favorites.length === 0) {
            favList.innerHTML = '<div class="empty-msg">Henüz favorilere eklenmiş bir içerik yok.</div>';
        } else {
            favorites.forEach(idx => {
                const item = database[idx];
                const div = document.createElement('div');
                div.className = 'fav-item';
                div.innerHTML = `
                    <div class="fav-info" onclick="selectFromFav(${idx})">
                        <strong>${item.type}</strong>
                        <span>${item.meaning}</span>
                    </div>
                    <button class="delete-fav-btn" onclick="removeFavorite(event, ${idx})">🗑️</button>
                `;
                favList.appendChild(div);
            });
        }
        document.getElementById('fav-modal').classList.add('open');
    }

    function closeFavoritesModal(e) {
        if (!e || e.target.id === 'fav-modal' || e.target.className === 'close-btn') {
            document.getElementById('fav-modal').classList.remove('open');
        }
    }

    function selectFromFav(index) {
        renderContent(index);
        closeFavoritesModal();
    }

    function removeFavorite(e, index) {
        e.stopPropagation();
        favorites = favorites.filter(id => id !== index);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
        openFavoritesModal();
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.src = "";
            currentAudio = null;
        }
        isPlaying = false;
        document.getElementById('btn-audio-ar').innerText = "🎙️ Hafız Tilaveti (Arapça Dinle)";
    }

    function playArabic() {
        const item = database[currentIndex];
        const btn = document.getElementById('btn-audio-ar');

        if (isPlaying) {
            stopAudio();
            return;
        }

        if (!item.sura || !item.ayah) {
            showToast("Hadis-i Şerifler için tilavet sesi bulunmamaktadır.");
            return;
        }

        btn.innerText = "⌛ Yükleniyor...";

        const suraStr = String(item.sura).padStart(3, '0');
        const ayahStr = String(item.ayah).padStart(3, '0');
        const audioUrl = `https://everyayah.com/data/Alafasy_128kbps/${suraStr}${ayahStr}.mp3`;

        currentAudio = new Audio(audioUrl);

        currentAudio.play().then(() => {
            isPlaying = true;
            btn.innerText = "⏹ Durdur";
        }).catch(() => {
            stopAudio();
            showToast("Ses yüklenirken bir hata oluştu.");
        });

        currentAudio.onended = () => {
            stopAudio();
        };
    }

    function copyContent() {
        const item = database[currentIndex];
        const textToCopy = `${item.type}\n\n${item.arabic}\n\n"${item.meaning}"\n\n— ${item.source}\n\nAyetin Vakti projesinden paylaşıldı.`;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("Metin kopyalandı!");
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast("Metin kopyalandı!");
        } catch (err) {
            showToast("Kopyalama başarısız oldu.");
        }
        document.body.removeChild(textArea);
    }

    function shareContent() {
        const item = database[currentIndex];
        const shareData = {
            title: 'Ayetin Vakti',
            text: `${item.type}: "${item.meaning}" (${item.source})`,
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            copyContent();
        }
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    initTheme();
    renderContent(getDailyIndex());
</script>

</body>
</html>
