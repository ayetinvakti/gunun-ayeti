    <script>
        (function() {
            // Dil ve RTL Kontrolü
            const savedLang = localStorage.getItem('user_lang') || 'tr';
            document.documentElement.lang = savedLang;
            if (savedLang === 'ar') document.documentElement.dir = 'rtl';

            // Tema Yükleme (titremeyi önlemek için en başta; tema sınıfı yalnızca <html> üzerinde)
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
                document.documentElement.classList.add('light-mode');
            }

            // Özel Renk Paleti Yükleme
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }

            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (customBg && !customText) {
                const m = /^#([0-9a-f]{6})$/i.exec(customBg.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    document.documentElement.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    document.documentElement.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    document.documentElement.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }

            // Tarayıcı çubuğu rengi sayfa zeminine uysun
            const metaTC = document.querySelector('meta[name="theme-color"]');
            if (metaTC) metaTC.setAttribute('content', customBg || (document.documentElement.classList.contains('light-mode') ? '#f8fafc' : '#0b1120'));
        })();
    </script>

            border: 1px solid var(--border-color);
            color: var(--text-color);

            height: 42px;
            border-radius: 50%;

            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;

            left: auto;
            right: 0;

            color: var(--accent-color); } }

        .top-btn {

            color: var(--accent-color);

        { type: "Hadis-i Şerif", sura: null, ayah: null, arabic: "مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ", meaning: "Kim ilim aramak için bir yola girerse, Allah bu sebeple ona cennete giden bir yolu kolaylaştırır.", source: "Müslim, 2699" },
        { type: "Hadis-i Şerif", sura: null, ayah: null, arabic: "نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ الصِّحَّةُ وَالْفَرَاغُ", meaning: "İki nimet vardır ki insanların çoğu bunlarda aldanır: sağlık ve boş vakit.", source: "Buhârî, 6412" },
        { type: "Hadis-i Şerif", sura: null, ayah: null, arabic: "مَا شَيْءٌ أَثْقَلُ فِي مِيزَانِ الْمُؤْمِنِ يَوْمَ الْقِيَامَةِ مِنْ خُلُقٍ حَسَنٍ", meaning: "Kıyamet gününde müminin terazisinde güzel ahlâktan daha ağır gelecek bir şey yoktur.", source: "Tirmizî, 2002" }
    ];

    let currentFilter = 'all';
    let currentIndex = -1;
    let toastTimeout = null;
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    let currentAudio = null;
    let isPlaying = false;

    function applyTranslations(lang) {
        const t = translations[lang] || translations.tr;
        
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });
    }

    function getFilteredDatabase() {
        if (currentFilter === 'all') return database;
        return database.filter(item => item.type === currentFilter);
    }

    function filterCategory(category) {
        currentFilter = category;
        
        document.querySelectorAll('.cat-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        event.target.classList.add('active');

        getRandomContent();
    }

    function getDailyIndex() {
        const filtered = getFilteredDatabase();
        const randFilteredIdx = Math.floor(Math.random() * filtered.length);
        return database.indexOf(filtered[randFilteredIdx]);
    }

    function renderContent(index) {
        stopAudio();
        currentIndex = index;
        const item = database[currentIndex];

        document.getElementById('type-badge').innerText = item.type;
        document.getElementById('arabic-content').innerText = item.arabic;
        document.getElementById('meaning-content').innerText = `"${item.meaning}"`;
        document.getElementById('source-content').innerText = `— ${item.source}`;

        const audioContainer = document.getElementById('audio-container');
        if (!item.sura || !item.ayah) {
            audioContainer.style.display = 'none';
        } else {
            audioContainer.style.display = 'flex';
        }
        const note = document.getElementById('audio-note');
        if (note) note.style.display = item.partial ? 'block' : 'none';

        updateFavIcon();
    }

    const shuffleBag = {};
    function getRandomContent() {
        const filtered = getFilteredDatabase();
        if (filtered.length === 0) return;
        let bag = shuffleBag[currentFilter];
        if (!bag || bag.length === 0) {
            bag = filtered.map(i => database.indexOf(i));
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            if (bag.length > 1 && bag[bag.length - 1] === currentIndex) bag.reverse();
            shuffleBag[currentFilter] = bag;
        }
        renderContent(bag.pop());
    }

    function updateFavIcon() {
        const favBtn = document.getElementById('fav-btn');
        const isFav = favorites.includes(currentIndex);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerText = isFav ? '★' : '☆';
    }

    function toggleFavorite() {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const favIndex = favorites.indexOf(currentIndex);
        
        if (favIndex > -1) {
            favorites.splice(favIndex, 1);
            showToast(t.toast_removed);
        } else {
            favorites.push(currentIndex);
            showToast(t.toast_added);
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
    }

    function openFavoritesModal() {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const favList = document.getElementById('fav-list');
        favList.innerHTML = '';

        if (favorites.length === 0) {
            favList.innerHTML = `<div class="empty-msg">${t.empty_fav}</div>`;
        } else {
            favorites.forEach(idx => {
                const item = database[idx];
                const div = document.createElement('div');
                div.className = 'fav-item';
                div.innerHTML = `
                    <div class="fav-info" onclick="selectFromFav(${idx})">
                        <strong>${item.type}</strong>
                        <span>${item.meaning}</span>
                    </div>
                    <button class="delete-fav-btn" onclick="removeFavorite(event, ${idx})">🗑️</button>
                `;
                favList.appendChild(div);
            });
        }
        document.getElementById('fav-modal').classList.add('active');
    }

    function closeFavoritesModal(e) {
        if (!e || e.target.id === 'fav-modal' || e.target.classList.contains('modal-close')) {
            document.getElementById('fav-modal').classList.remove('active');
        }
    }

    function selectFromFav(index) {
        renderContent(index);
        closeFavoritesModal();
    }

    function removeFavorite(e, index) {
        e.stopPropagation();
        favorites = favorites.filter(id => id !== index);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
        openFavoritesModal();
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.src = "";
            currentAudio = null;
        }
        isPlaying = false;
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const btn = document.getElementById('btn-audio-ar');
        if(btn) btn.innerText = t.audio_btn;
    }

    function playArabic() {
        const item = database[currentIndex];
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const btn = document.getElementById('btn-audio-ar');

        if (isPlaying) {
            stopAudio();
            return;
        }

        if (!item.sura || !item.ayah) {
            return;
        }

        btn.innerText = t.audio_loading;
        isPlaying = true;

        const last = item.ayahEnd || item.ayah;
        const urls = [];
        for (let a = item.ayah; a <= last; a++) {
            urls.push(`https://everyayah.com/data/Alafasy_128kbps/${String(item.sura).padStart(3, '0')}${String(a).padStart(3, '0')}.mp3`);
        }
        let i = 0;
        const playNext = () => {
            const audio = new Audio(urls[i]);
            currentAudio = audio;
            const fail = () => { if (currentAudio === audio) { stopAudio(); showToast(t.toast_audio_fail); } };
            audio.onerror = fail;
            audio.onended = () => {
                if (currentAudio !== audio) return;
                i++;
                if (i < urls.length) playNext(); else stopAudio();
            };
            audio.play().then(() => {
                if (currentAudio === audio) btn.innerText = t.audio_stop;
            }).catch(fail);
        };
        playNext();
    }

    function copyContent() {
        const item = database[currentIndex];
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const textToCopy = `${item.type}\n\n${item.arabic}\n\n"${item.meaning}"\n\n— ${item.source}\n\n${t.share_suffix}`;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(t.toast_copied);
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast(t.toast_copied);
        } catch (err) {
            showToast(t.toast_copy_fail);
        }
        document.body.removeChild(textArea);
    }

    function shareContent() {
        const item = database[currentIndex];
        const shareData = {
            title: 'Ayetin Vakti',
            text: `${item.type}: "${item.meaning}" (${item.source})`,
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            copyContent();
        }
    }

    // ---- Paylaşım kartı (PNG): ekrandaki içeriği ve tema renklerini kullanır ----
    let cardBusy = false;

    function cardWrap(ctx, text, maxW) {
        const out = [];
        String(text).split(/\n+/).forEach(par => {
            const words = par.trim().split(/\s+/).filter(Boolean);
            let line = '';
            words.forEach(w => {
                const test = line ? line + ' ' + w : w;
                if (!line || ctx.measureText(test).width <= maxW) line = test;
                else { out.push(line); line = w; }
            });
            if (line) out.push(line);
        });
        return out;
    }

    function cardRoundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    async function makeCardBlob() {
        const W = 1080, H = 1350, PAD = 64;
        const cs = getComputedStyle(document.documentElement);
        const pick = (n, f) => (cs.getPropertyValue(n).trim() || f);
        const solid = (c, f) => (!c || c === 'transparent' || /rgba\(.*,\s*0\)$/.test(c)) ? f : c;
        const accent = pick('--accent-color', '#10b981');
        const textC = pick('--text-color', '#f8fafc');
        const muted = pick('--text-muted', '#94a3b8');
        const border = pick('--border-color', '#334155');
        const pageBg = solid(getComputedStyle(document.body).backgroundColor, pick('--bg-color', '#0b1120'));
        const cardBg = solid(getComputedStyle(document.querySelector('.card')).backgroundColor, pick('--card-bg', '#1e293b'));
        try { await document.fonts.load('400 40px Amiri', 'ءآأ'); await document.fonts.ready; } catch (e) {}

        const rtlUI = document.documentElement.dir === 'rtl';
        const badge = document.getElementById('type-badge').innerText.trim();
        const arabic = document.getElementById('arabic-content').innerText.trim();
        const meaning = document.getElementById('meaning-content').innerText.trim();
        const source = document.getElementById('source-content').innerText.trim();

        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        const SANS = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        const ARF = "Amiri, 'Traditional Arabic', serif";
        const boxX = PAD, boxY = PAD, boxW = W - 2 * PAD, boxH = H - 2 * PAD;
        const textW = boxW - 120;
        const y0 = boxY + 60 + 64 + 50;
        const y1 = boxY + boxH - 60 - 110;
        const avail = y1 - y0;

        function layout(s) {
            const aSize = 78 * s, mSize = 44 * s, sSize = 36 * s, gap = 46 * s;
            ctx.direction = 'rtl';
            ctx.font = `400 ${aSize}px ${ARF}`;
            const aLines = cardWrap(ctx, arabic, textW);
            ctx.direction = rtlUI ? 'rtl' : 'ltr';
            ctx.font = `italic 400 ${mSize}px ${SANS}`;
            const mLines = cardWrap(ctx, meaning, textW);
            ctx.font = `700 ${sSize}px ${SANS}`;
            const sLines = cardWrap(ctx, source, textW);
            const aLH = aSize * 1.9, mLH = mSize * 1.5, sLH = sSize * 1.4;
            const total = aLines.length * aLH + gap + mLines.length * mLH + gap + sLines.length * sLH;
            return { aSize, mSize, sSize, gap, aLines, mLines, sLines, aLH, mLH, sLH, total };
        }
        let L = layout(1);
        for (let s = 0.95; L.total > avail && s >= 0.4; s -= 0.05) L = layout(s);

        ctx.fillStyle = pageBg;
        ctx.fillRect(0, 0, W, H);
        cardRoundRect(ctx, boxX, boxY, boxW, boxH, 48);
        ctx.fillStyle = cardBg;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = border;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';

        // rozet
        ctx.direction = rtlUI ? 'rtl' : 'ltr';
        ctx.font = `700 34px ${SANS}`;
        const bw = ctx.measureText(badge).width + 64;
        const bx = (W - bw) / 2, by = boxY + 60;
        cardRoundRect(ctx, bx, by, bw, 64, 32);
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = accent;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = accent;
        ctx.fillText(badge, W / 2, by + 44);

        // gövde (dikey ortalı)
        let y = y0 + Math.max(0, (avail - L.total) / 2);
        ctx.direction = 'rtl';
        ctx.font = `400 ${L.aSize}px ${ARF}`;
        ctx.fillStyle = textC;
        L.aLines.forEach(t => { y += L.aLH; ctx.fillText(t, W / 2, y - L.aLH * 0.28); });
        y += L.gap;
        ctx.direction = rtlUI ? 'rtl' : 'ltr';
        ctx.font = `italic 400 ${L.mSize}px ${SANS}`;
        ctx.fillStyle = textC;
        L.mLines.forEach(t => { y += L.mLH; ctx.fillText(t, W / 2, y - L.mLH * 0.25); });
        y += L.gap * 0.6;
        ctx.fillStyle = accent;
        ctx.globalAlpha = 0.5;
        ctx.fillRect(W / 2 - 60, y, 120, 3);
        ctx.globalAlpha = 1;
        y += L.gap * 0.4;
        ctx.font = `700 ${L.sSize}px ${SANS}`;
        ctx.fillStyle = accent;
        L.sLines.forEach(t => { y += L.sLH; ctx.fillText(t, W / 2, y - L.sLH * 0.25); });

        // alt bilgi
        ctx.direction = 'ltr';
        ctx.font = `700 44px ${SANS}`;
        ctx.fillStyle = accent;
        ctx.fillText('Ayetin Vakti', W / 2, boxY + boxH - 82);
        ctx.font = `400 28px ${SANS}`;
        ctx.fillStyle = muted;
        ctx.fillText('ayetinvakti.github.io', W / 2, boxY + boxH - 40);

        return new Promise(res => c.toBlob(res, 'image/png'));
    }

    async function shareCard() {
        if (cardBusy) return;
        cardBusy = true;
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        try {
            const blob = await makeCardBlob();
            if (!blob) throw new Error('blob');
            const file = new File([blob], 'ayetin-vakti.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'Ayetin Vakti' }); }
                catch (e) { if (!e || e.name !== 'AbortError') throw e; }
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'ayetin-vakti.png';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
                showToast(t.toast_card_saved);
            }
        } catch (err) {
            showToast(t.toast_card_fail);
        }
        cardBusy = false;
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // Tarayıcı çubuğu rengini (theme-color) o anki arka plan rengine eşitler
    function updateThemeColor() {
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        const m = document.querySelector('meta[name="theme-color"]');
        if (m && bg) m.setAttribute('content', bg);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = isLight ? '☀️' : '🌙';
        updateThemeColor();
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Tema sınıfı head scriptinde <html> üzerine eklendi; burada yalnızca buton ikonu eşitlenir
        const themeBtn = document.getElementById('theme-btn');
        if (themeBtn) {
            themeBtn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
            themeBtn.addEventListener('click', toggleTheme);
        }
        updateThemeColor();

        const savedLang = localStorage.getItem('user_lang') || 'tr';
        applyTranslations(savedLang);

        renderContent(getDailyIndex());
    });
</script>
