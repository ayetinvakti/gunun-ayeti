    <meta name="theme-color" content="#0b1120">

    <script>
        (function() {
            // Dil ve RTL Kontrolü
            const savedLang = localStorage.getItem('user_lang') || 'tr';
            document.documentElement.lang = savedLang;
            if (savedLang === 'ar') document.documentElement.dir = 'rtl';

            // Tema Yükleme (titremeyi önlemek için en başta; tema sınıfı yalnızca <html> üzerinde)
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
                document.documentElement.classList.add('light-mode');
            }

            // Özel Renk Paleti Yükleme
            const customAccent = localStorage.getItem('custom_accent');
            const customText = localStorage.getItem('custom_text');
            const customBg = localStorage.getItem('custom_bg');

            if (customAccent) document.documentElement.style.setProperty('--accent-color', customAccent);
            if (customText) document.documentElement.style.setProperty('--text-color', customText);
            if (customBg) {
                document.documentElement.style.setProperty('--bg-color', customBg);
                document.documentElement.style.setProperty('--card-bg', customBg);
            }

            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (customBg && !customText) {
                const m = /^#([0-9a-f]{6})$/i.exec(customBg.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    document.documentElement.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    document.documentElement.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    document.documentElement.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                }
            }

            // Tarayıcı çubuğu rengi sayfa zeminine uysun
            const metaTC = document.querySelector('meta[name="theme-color"]');
            if (metaTC) metaTC.setAttribute('content', customBg || (document.documentElement.classList.contains('light-mode') ? '#f8fafc' : '#0b1120'));
        })();
    </script>

            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;

        .container {

            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;

            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            padding-top: 5px;
        }

            right: 0;
            top: 0;
            display: flex;
            gap: 8px;
            align-items: center;
        }

            right: auto;
            left: 0;
        }

        .home-btn {
            position: absolute;
            left: 0;
            top: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

            left: auto;
            right: 0;
            transform: scaleX(-1);
        }

        @media (hover: hover) { .home-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color); } }

        .top-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);

            border-radius: 21px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        @media (hover: hover) { .top-btn:hover {
            border-color: var(--accent-color); } }

        .theme-icon-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;

        }

            color: var(--accent-color); } }

            border: none;

        }

            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;

        .modal-overlay.active {

        }

            border: none;

            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
    </style>
</head>

    let currentFilter = 'all';
    let currentIndex = -1;
    let toastTimeout = null;
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    let currentAudio = null;
    let isPlaying = false;

    function applyTranslations(lang) {
        const t = translations[lang] || translations.tr;
        
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                if (el.tagName === 'TITLE') document.title = t[key];
                else el.innerHTML = t[key];
            }
        });
    }

    function getFilteredDatabase() {
        if (currentFilter === 'all') return database;
        return database.filter(item => item.type === currentFilter);
    }

    function filterCategory(category) {
        currentFilter = category;
        
        document.querySelectorAll('.cat-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        event.target.classList.add('active');

        getRandomContent();
    }

    function getDailyIndex() {
        const filtered = getFilteredDatabase();
        const randFilteredIdx = Math.floor(Math.random() * filtered.length);
        return database.indexOf(filtered[randFilteredIdx]);
    }

    function renderContent(index) {
        stopAudio();
        currentIndex = index;
        const item = database[currentIndex];

        document.getElementById('type-badge').innerText = item.type;
        document.getElementById('arabic-content').innerText = item.arabic;
        document.getElementById('meaning-content').innerText = `"${item.meaning}"`;
        document.getElementById('source-content').innerText = `— ${item.source}`;

        const audioContainer = document.getElementById('audio-container');
        if (!item.sura || !item.ayah) {
            audioContainer.style.display = 'none';
        } else {
            audioContainer.style.display = 'flex';
        }
        const note = document.getElementById('audio-note');
        if (note) note.style.display = item.partial ? 'block' : 'none';

        updateFavIcon();
    }

    const shuffleBag = {};
    function getRandomContent() {
        const filtered = getFilteredDatabase();
        if (filtered.length === 0) return;
        let bag = shuffleBag[currentFilter];
        if (!bag || bag.length === 0) {
            bag = filtered.map(i => database.indexOf(i));
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            if (bag.length > 1 && bag[bag.length - 1] === currentIndex) bag.reverse();
            shuffleBag[currentFilter] = bag;
        }
        renderContent(bag.pop());
    }

    function updateFavIcon() {
        const favBtn = document.getElementById('fav-btn');
        const isFav = favorites.includes(currentIndex);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerText = isFav ? '★' : '☆';
    }

    function toggleFavorite() {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const favIndex = favorites.indexOf(currentIndex);
        
        if (favIndex > -1) {
            favorites.splice(favIndex, 1);
            showToast(t.toast_removed);
        } else {
            favorites.push(currentIndex);
            showToast(t.toast_added);
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
    }

    function openFavoritesModal() {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const favList = document.getElementById('fav-list');
        favList.innerHTML = '';

        if (favorites.length === 0) {
            favList.innerHTML = `<div class="empty-msg">${t.empty_fav}</div>`;
        } else {
            favorites.forEach(idx => {
                const item = database[idx];
                const div = document.createElement('div');
                div.className = 'fav-item';
                div.innerHTML = `
                    <div class="fav-info" onclick="selectFromFav(${idx})">
                        <strong>${item.type}</strong>
                        <span>${item.meaning}</span>
                    </div>
                    <button class="delete-fav-btn" onclick="removeFavorite(event, ${idx})">🗑️</button>
                `;
                favList.appendChild(div);
            });
        }
        document.getElementById('fav-modal').classList.add('active');
    }

    function closeFavoritesModal(e) {
        if (!e || e.target.id === 'fav-modal' || e.target.classList.contains('modal-close')) {
            document.getElementById('fav-modal').classList.remove('active');
        }
    }

    function selectFromFav(index) {
        renderContent(index);
        closeFavoritesModal();
    }

    function removeFavorite(e, index) {
        e.stopPropagation();
        favorites = favorites.filter(id => id !== index);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavIcon();
        openFavoritesModal();
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.src = "";
            currentAudio = null;
        }
        isPlaying = false;
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const btn = document.getElementById('btn-audio-ar');
        if(btn) btn.innerText = t.audio_btn;
    }

    function playArabic() {
        const item = database[currentIndex];
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const btn = document.getElementById('btn-audio-ar');

        if (isPlaying) {
            stopAudio();
            return;
        }

        if (!item.sura || !item.ayah) {
            return;
        }

        btn.innerText = t.audio_loading;
        isPlaying = true;

        const last = item.ayahEnd || item.ayah;
        const urls = [];
        for (let a = item.ayah; a <= last; a++) {
            urls.push(`https://everyayah.com/data/Alafasy_128kbps/${String(item.sura).padStart(3, '0')}${String(a).padStart(3, '0')}.mp3`);
        }
        let i = 0;
        const playNext = () => {
            const audio = new Audio(urls[i]);
            currentAudio = audio;
            const fail = () => { if (currentAudio === audio) { stopAudio(); showToast(t.toast_audio_fail); } };
            audio.onerror = fail;
            audio.onended = () => {
                if (currentAudio !== audio) return;
                i++;
                if (i < urls.length) playNext(); else stopAudio();
            };
            audio.play().then(() => {
                if (currentAudio === audio) btn.innerText = t.audio_stop;
            }).catch(fail);
        };
        playNext();
    }

    function copyContent() {
        const item = database[currentIndex];
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const textToCopy = `${item.type}\n\n${item.arabic}\n\n"${item.meaning}"\n\n— ${item.source}\n\n${t.share_suffix}`;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(t.toast_copied);
            }).catch(() => fallbackCopy(textToCopy));
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        const lang = localStorage.getItem('user_lang') || 'tr';
        const t = translations[lang] || translations.tr;
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            showToast(t.toast_copied);
        } catch (err) {
            showToast(t.toast_copy_fail);
        }
        document.body.removeChild(textArea);
    }

    function shareContent() {
        const item = database[currentIndex];
        const shareData = {
            title: 'Ayetin Vakti',
            text: `${item.type}: "${item.meaning}" (${item.source})`,
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            copyContent();
        }
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        
        if (toastTimeout) clearTimeout(toastTimeout);
        
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // Tarayıcı çubuğu rengini (theme-color) o anki arka plan rengine eşitler
    function updateThemeColor() {
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        const m = document.querySelector('meta[name="theme-color"]');
        if (m && bg) m.setAttribute('content', bg);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = isLight ? '☀️' : '🌙';
        updateThemeColor();
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Tema sınıfı head scriptinde <html> üzerine eklendi; burada yalnızca buton ikonu eşitlenir
        const themeBtn = document.getElementById('theme-btn');
        if (themeBtn) {
            themeBtn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
            themeBtn.addEventListener('click', toggleTheme);
        }
        updateThemeColor();

        const savedLang = localStorage.getItem('user_lang') || 'tr';
        applyTranslations(savedLang);

        renderContent(getDailyIndex());
    });
</script>

</body>
</html>
